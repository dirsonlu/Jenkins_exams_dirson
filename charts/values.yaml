replicaCount: 3

movieService:
  image:
    repository: luddirs/movie-service
    tag: "latest"
    pullPolicy: Always

  databaseUrl: "postgresql://movie_db_username:movie_db_password@movie-db:5432/movie_db_dev"

castService:
  image:
    repository: luddirs/cast-service
    tag: "latest"
    pullPolicy: Always

  databaseUrl: "postgresql://cast_db_username:cast_db_password@cast-db:5432/cast_db_dev"

service:
  type: NodePort
  port: 5000
  targetPort: 5000
  nodePort: 30007

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

imagePullSecrets: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

ingress:
  enabled: false
