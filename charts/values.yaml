replicaCount: 3

image:
  repository: luddirs/kubernetes-devops-project-fastapi
  pullPolicy: Always
  tag: "latest"

env:
  DATABASE_URL: "postgresql://admin:password@db:5432/storedb"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: NodePort
  port: 5000
  targetPort: 5000
  nodePort: 30007

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

database:
  url: "postgresql://admin:password@db:5432/storedb"
